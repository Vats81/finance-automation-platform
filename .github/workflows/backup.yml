name: Scheduled backup

# Daily logical backup of every table, taken by calling the app's own admin
# backup endpoint (no DB credentials needed here), integrity-checked, and
# stored as an encrypted GitHub artifact (30-day rolling retention). The dump
# holds customer data and password hashes and this repo is public, so it is
# AES-256 encrypted BEFORE it is uploaded - artifacts on a public repo are
# otherwise world-downloadable.
#
# A backup that is empty, truncated, or at an unknown schema version FAILS this
# job (GitHub emails the repo owner). backup-monitor.yml separately alerts if
# no good backup has been produced recently. restore-drill.yml proves a backup
# can actually be restored.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   BACKUP_ADMIN_EMAIL             a platform-admin account's email
#   BACKUP_ADMIN_PASSWORD          that account's password
#   BACKUP_ENCRYPTION_PASSPHRASE   any strong passphrase; keep it somewhere safe
# Optional repository variable:
#   BACKUP_API_BASE_URL           defaults to the Render URL below
#
# Restore: see docs/RECOVERY_RUNBOOK.md.

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (off-hour for better scheduler reliability)
  workflow_dispatch: {}

concurrency:
  group: scheduled-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verification script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend/scripts/verify_backup.py
            backend/app/shared/infrastructure/backup_format.py
          sparse-checkout-cone-mode: false

      - name: Take, verify and encrypt backup
        env:
          BASE_URL: ${{ vars.BACKUP_API_BASE_URL || 'https://finance-automation-platform-1.onrender.com/api/v1' }}
          ADMIN_EMAIL: ${{ secrets.BACKUP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.BACKUP_ADMIN_PASSWORD }}
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${ADMIN_EMAIL}" ] || [ -z "${ADMIN_PASSWORD}" ] || [ -z "${PASSPHRASE}" ]; then
            echo "::error::Missing a required secret (BACKUP_ADMIN_EMAIL / BACKUP_ADMIN_PASSWORD / BACKUP_ENCRYPTION_PASSPHRASE)."
            exit 1
          fi

          # Render's free tier sleeps when idle; the first request can take
          # ~1 min to wake it, so retry the login through the cold start.
          echo "Authenticating as platform admin..."
          token=""
          for attempt in $(seq 1 6); do
            resp="$(curl -sS --max-time 120 -X POST "${BASE_URL}/auth/login" \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}" || true)"
            token="$(printf '%s' "${resp}" | jq -r '.access_token // empty')"
            if [ -n "${token}" ]; then
              echo "Logged in on attempt ${attempt}."
              break
            fi
            echo "Attempt ${attempt}: no token yet ($(printf '%s' "${resp}" | head -c 200)). Sleeping 20s."
            sleep 20
          done
          if [ -z "${token}" ]; then
            echo "::error::Could not authenticate as platform admin - check the BACKUP_ADMIN_* secrets."
            exit 1
          fi

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          plain="backup-${stamp}.json"

          echo "Fetching backup..."
          code="$(curl -sS --max-time 300 -w '%{http_code}' -o "${plain}" \
            -H "Authorization: Bearer ${token}" "${BASE_URL}/admin/backup")"
          if [ "${code}" != "200" ]; then
            echo "::error::Backup endpoint returned HTTP ${code}."
            head -c 500 "${plain}" || true
            exit 1
          fi

          # Integrity: manifest present, schema version recorded, every table's
          # row count and checksum match its data, users/businesses non-empty,
          # generated within the last hour.
          if ! summary="$(python3 backend/scripts/verify_backup.py "${plain}" --max-age-hours 1)"; then
            echo "::error::${summary}"
            exit 1
          fi
          echo "${summary}"
          size_bytes="$(wc -c < "${plain}")"
          if [ "${size_bytes}" -lt 2000 ]; then
            echo "::error::Backup is suspiciously small (${size_bytes} bytes)."
            exit 1
          fi

          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "${PASSPHRASE}" --output "${plain}.gpg" "${plain}"
          rm -f "${plain}"

          sha="$(sha256sum "${plain}.gpg" | cut -d' ' -f1)"
          {
            echo "### Backup ${stamp}"
            echo "- ${summary}"
            echo "- plaintext size: ${size_bytes} bytes; encrypted file sha256: \`${sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "ARTIFACT_NAME=backup-${stamp}" >> "${GITHUB_ENV}"
          echo "ARTIFACT_PATH=${plain}.gpg" >> "${GITHUB_ENV}"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          retention-days: 30
          if-no-files-found: error

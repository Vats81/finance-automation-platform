name: Keep backend awake

# Render's free tier puts the backend to sleep after ~15 minutes without
# traffic, and the first request after that takes a minute or more to wake
# it — long enough that logins on a quiet site hit the frontend's request
# timeout. This pings /health every 5 minutes so it never goes idle.
#
# Notes:
# - GitHub scheduled runs are best-effort and, in practice for this repo,
#   very late (the daily backup cron consistently starts ~6.5h after its
#   time). Treat this as a backup, not the primary keep-alive: an external
#   uptime monitor (UptimeRobot / cron-job.org) is far more reliable. See
#   DEPLOY.md section 10. The repo is public, so the run minutes are free.
# - /health returns 200 "healthy" or "degraded" (Redis isn't running here —
#   expected) and 503 "unhealthy" when Postgres is unreachable. The job
#   passes on healthy/degraded. It fails if the app never answers (a bare
#   Render proxy/holding page has no app JSON in it) OR answers "unhealthy"
#   — the backend being up but unable to reach its database is an outage
#   worth an alert, and the failure log includes the reason.
# - It retries 3 times before failing, so a brief blip doesn't email you.
# - Always-on uses the free tier's monthly instance hours (750h; one
#   service running 24/7 is ~744h). Hours are shared across every free web
#   service on the Render account.
# - GitHub disables scheduled workflows after 60 days with no repository
#   activity; re-enable from the Actions tab if that ever happens.
#
# Optional repository variable KEEPALIVE_URL overrides the URL below.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.KEEPALIVE_URL || 'https://finance-automation-platform-1.onrender.com/health' }}
        run: |
          for attempt in 1 2 3; do
            rm -f body.txt
            code="$(curl -sS --max-time 120 -o body.txt -w '%{http_code}' "${URL}" || true)"
            if grep -q '"status"' body.txt 2>/dev/null; then
              if grep -q '"status":"unhealthy"' body.txt; then
                echo "attempt ${attempt}: backend is up but UNHEALTHY (HTTP ${code}): $(head -c 400 body.txt)"
              else
                echo "attempt ${attempt}: HTTP ${code} from the app — backend is awake: $(head -c 200 body.txt)"
                exit 0
              fi
            else
              echo "attempt ${attempt}: HTTP ${code:-none}, no app response yet. Body: $(head -c 200 body.txt 2>/dev/null)"
            fi
            sleep 15
          done
          echo "::error::Backend is down or unhealthy after 3 attempts — see the log above for the reason."
          exit 1

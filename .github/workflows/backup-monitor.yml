name: Backup monitor

# Alerts when backups have stopped, not just when one run fails: the scheduled
# backup can silently stop running (GitHub pauses schedules on repos with no
# recent activity, and skips them under load), and a green history proves
# nothing if no new run exists. This checks the facts directly: is there a
# SUCCESSFUL backup run in the last 36 hours, and does its artifact still
# exist with a plausible size?
#
# On a problem the job fails (GitHub emails the repo owner) and opens - or
# comments on - a "Backup problem" issue so the alert persists until fixed.

on:
  schedule:
    - cron: "41 9 * * *" # daily, six hours after the backup is due
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MAX_AGE_HOURS: "36"
      MIN_BYTES: "1500"
    steps:
      - name: Look for a recent, intact backup
        id: check
        run: |
          set -uo pipefail
          problem=""

          run="$(gh api "repos/${REPO}/actions/workflows/backup.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0] // empty')"
          if [ -z "${run}" ]; then
            problem="No successful backup run exists at all."
          else
            run_id="$(printf '%s' "${run}" | jq -r .id)"
            created="$(printf '%s' "${run}" | jq -r .created_at)"
            age_h="$(( ( $(date -u +%s) - $(date -u -d "${created}" +%s) ) / 3600 ))"
            echo "Latest successful backup run ${run_id} was ${age_h}h ago (${created})."
            if [ "${age_h}" -gt "${MAX_AGE_HOURS}" ]; then
              problem="The newest successful backup is ${age_h} hours old (limit ${MAX_AGE_HOURS}h). Backups may have stopped."
            else
              art="$(gh api "repos/${REPO}/actions/runs/${run_id}/artifacts" \
                --jq '.artifacts[0] // empty')"
              if [ -z "${art}" ]; then
                problem="Backup run ${run_id} succeeded but has no artifact."
              elif [ "$(printf '%s' "${art}" | jq -r .expired)" = "true" ]; then
                problem="The artifact of backup run ${run_id} has expired."
              else
                size="$(printf '%s' "${art}" | jq -r .size_in_bytes)"
                echo "Artifact $(printf '%s' "${art}" | jq -r .name): ${size} bytes."
                if [ "${size}" -lt "${MIN_BYTES}" ]; then
                  problem="Backup artifact is only ${size} bytes - it looks empty."
                fi
              fi
            fi
          fi

          if [ -n "${problem}" ]; then
            echo "::error::${problem}"
            echo "problem=${problem}" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          echo "Backups look healthy."

      - name: Raise or update the alert issue
        if: failure() && steps.check.outputs.problem != ''
        env:
          PROBLEM: ${{ steps.check.outputs.problem }}
        run: |
          set -eu
          existing="$(gh issue list --repo "${REPO}" --state open --search 'Backup problem in:title' \
            --json number --jq '.[0].number // empty')"
          body="${PROBLEM}

          Check: ${GITHUB_SERVER_URL}/${REPO}/actions/workflows/backup.yml
          Fix, then run the 'Scheduled backup' workflow manually and confirm it is green.
          See docs/RECOVERY_RUNBOOK.md."
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${REPO}" --body "${body}"
          else
            gh issue create --repo "${REPO}" --title "Backup problem: no recent good backup" --body "${body}"
          fi

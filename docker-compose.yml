name: finance-automation-platform

networks:
  fap-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  azurite-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: fap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fap-network

  redis:
    image: redis:7-alpine
    container_name: fap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fap-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fap-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - fap-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: fap-azurite
    restart: unless-stopped
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --loose"
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
    networks:
      - fap-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fap-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      azurite:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - fap-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: fap-celery-worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=4 -Q default,ocr,notifications
    networks:
      - fap-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: fap-celery-beat
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    networks:
      - fap-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fap-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_ENTRA_TENANT_ID: ${NEXT_PUBLIC_ENTRA_TENANT_ID}
      NEXT_PUBLIC_ENTRA_SPA_CLIENT_ID: ${NEXT_PUBLIC_ENTRA_SPA_CLIENT_ID}
      NEXT_PUBLIC_ENTRA_API_SCOPE: ${NEXT_PUBLIC_ENTRA_API_SCOPE}
      NEXT_PUBLIC_AUTH_DEV_MODE: ${NEXT_PUBLIC_AUTH_DEV_MODE}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - fap-network

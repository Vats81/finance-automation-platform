# Optional Render Blueprint (New -> Blueprint -> pick this repo).
#
# This gets you the two resources (Postgres + web service) in one step, but
# a few env vars still need to be filled in by hand afterwards in Render's
# dashboard, because Render's own Postgres connection string uses the plain
# "postgres://" scheme while this app needs the SQLAlchemy driver spelled
# out ("postgresql+asyncpg://" / "postgresql+psycopg2://"). See DEPLOY.md
# for the full walkthrough (also the more reliable path if you'd rather set
# everything up manually through the dashboard instead of this blueprint).
databases:
  - name: financeai-db
    plan: free
    databaseName: fap_db
    user: fap_user

services:
  - type: web
    name: financeai-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    startCommand: "sh -c \"alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT\""
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_DEV_MODE
        value: "false"
      # Fill in after the Postgres instance exists: copy its "External
      # Database URL" from the Render dashboard, then rewrite the scheme
      # as described in DEPLOY.md.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: JWT_SECRET_KEY
        sync: false
      # Fill in once the Vercel frontend URL is known.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false

[project]
name = "finance-automation-platform-backend"
version = "0.1.0"
description = "AP Automation backend - Clean Architecture / DDD"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.3",
    "redis==5.0.8",
    "celery==5.4.0",
    "kombu==5.4.2",
    "azure-storage-blob==12.23.0",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.0",
    "tenacity==9.0.0",
    "slowapi==0.1.9",
    "structlog==24.4.0",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-instrumentation-fastapi==0.48b0",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "reportlab==4.2.5",
    "anthropic==0.119.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "testcontainers[postgres,rabbitmq]==4.8.1",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "factory-boy==3.3.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require real Postgres/Redis/RabbitMQ via testcontainers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008", # FastAPI's Depends(...) in argument defaults is the idiomatic pattern
    "B024", # abstract base classes without abstract methods are fine as marker interfaces
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
